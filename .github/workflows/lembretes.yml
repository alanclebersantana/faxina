# Envia os lembretes do Bora pra Faxina!
# Quem dispara a cada 5 minutos é o cron-job.org (veja o README, seção 6.5).
# O agendamento abaixo fica só como reserva: o do GitHub não tem horário garantido.
# Configure o segredo FIREBASE_SERVICE_ACCOUNT em Settings → Secrets and variables → Actions.
name: Lembretes

on:
  schedule:
    # a cada 5 minutos, começando no minuto 2 (foge do horário cheio, quando o GitHub fica mais lento)
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notificacoes

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: notificacoes
        run: npm install --omit=dev --no-audit --no-fund

      - name: Enviar lembretes
        working-directory: notificacoes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node enviar.js

      # O GitHub pausa agendamentos de repositórios sem atividade por 60 dias.
      # Este passo pede para manter o agendamento ligado.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/lembretes.yml/enable"
