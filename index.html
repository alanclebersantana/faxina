<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5779F">
<meta name="description" content="Checklist da rotina de faxina da casa, um cômodo por dia, sincronizado com a família.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faxina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bora pra Faxina!</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
<style>
:root{--acc:#E5779F;--bg:#FBF8F5;--card:#FFFFFF;--ink:#2A2532;--muted:#8C8496;--line:#F0EAE5;--soft:#F6F1EC;--red:#DD5258;--redbg:#FDEDED;--shadow:0 1px 2px rgba(40,30,50,.04),0 8px 24px rgba(40,30,50,.06);--c:#E5779F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131A;--card:#211E27;--ink:#F3EFF6;--muted:#9E96A9;--line:#2E2A35;--soft:#2A2631;--redbg:#3B2226;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#15131A;--card:#211E27;--ink:#F3EFF6;--muted:#9E96A9;--line:#2E2A35;--soft:#2A2631;--redbg:#3B2226;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;padding:0 16px 110px}
.serif{font-family:'Nunito',sans-serif}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--acc);color:#fff}
.brand b{font-family:'Nunito',sans-serif;font-weight:900;font-size:20px;letter-spacing:-.3px;color:var(--acc)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-right:10px}
.sync i{width:7px;height:7px;border-radius:50%;background:#45AE84;box-shadow:0 0 0 3px color-mix(in srgb,#45AE84 22%,transparent)}
.who{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.sm{width:22px;height:22px;font-size:10px}

/* banner */
.alert{display:flex;gap:12px;align-items:center;background:var(--redbg);color:var(--red);border-radius:16px;padding:12px 14px;margin:6px 0 14px;font-size:13.5px;font-weight:700}
.alert span{font-weight:500;opacity:.85;display:block;font-size:12.5px;margin-top:2px}

/* hero */
.hero{border-radius:26px;padding:20px;display:flex;align-items:center;gap:16px;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 20%,var(--card)) 0%,var(--card) 75%);box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{font-family:'Nunito',sans-serif;font-weight:700;font-size:28px;margin:2px 0 4px;letter-spacing:-.5px}
.hero .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--c)}
.hero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.hero .meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:color-mix(in srgb,var(--c) 14%,var(--line))}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:'Nunito',sans-serif;font-size:28px;font-weight:700;line-height:1}
.ring .lbl small{display:block;font-size:11px;color:var(--muted);margin-top:3px}

/* strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.dbtn{border-radius:16px;padding:9px 0 8px;text-align:center;background:var(--card);border:1px solid var(--line);transition:.2s}
.dbtn small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.dbtn b{display:block;font-size:16px;margin:2px 0 5px}
.dbtn .dot{width:7px;height:7px;border-radius:50%;margin:0 auto;border:1.6px solid var(--dc);background:transparent}
.dbtn .dot.full{background:var(--dc)}
.dbtn .dot.late{border-color:var(--red);background:var(--red)}
.dbtn.on{background:var(--dc);border-color:var(--dc);color:#fff}
.dbtn.on small{color:rgba(255,255,255,.85)}
.dbtn.on .dot{border-color:#fff}.dbtn.on .dot.full{background:#fff}
.dbtn.today:not(.on){border-color:var(--dc)}

/* section */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-family:'Nunito',sans-serif;font-weight:700;font-size:19px;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.btn.dark{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.full{width:100%;justify-content:center;padding:14px;font-size:14.5px;border-radius:16px}
.btn.red{color:var(--red)}
.btn.on{background:var(--ink);color:var(--bg)}

/* room */
.room{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
.rh{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.ri{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 14%,transparent);color:var(--rc);flex:none}
.ri svg.i{width:22px;height:22px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15.5px;font-weight:700}
.rt small{color:var(--muted);font-size:12.5px}
.mini{height:5px;border-radius:9px;background:var(--soft);margin-top:7px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--rc);border-radius:9px;transition:width .5s}
.chev{color:var(--muted);transition:transform .25s}
.room.open .chev{transform:rotate(180deg)}
.rb{display:none;padding:0 16px 12px}
.room.open .rb{display:block}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.cb{width:24px;height:24px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--rc) 60%,var(--line));display:grid;place-items:center;flex:none;transition:.2s;color:#fff}
.cb svg.i{width:14px;height:14px;stroke-width:3}
.item.done .cb{background:var(--rc);border-color:var(--rc);animation:pop .3s}
.it{flex:1;font-size:14.5px;line-height:1.35}
.item.done .it{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.tag{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--red);background:var(--redbg);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:1px;text-decoration:none}
.tag.soft{color:var(--muted);background:var(--soft)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.tip{display:flex;gap:10px;background:var(--soft);border-radius:14px;padding:11px 12px;margin-top:8px;font-size:13px;line-height:1.45;color:var(--muted)}
.tip svg.i{color:var(--rc);width:18px;height:18px;margin-top:1px}
.medalmini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--soft)}
.ib.r{color:var(--red)}
.inrow{display:flex;gap:8px;margin-top:10px}
.inp{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--rc,var(--ink))}
textarea.inp{width:100%;resize:vertical;min-height:56px;margin-top:8px}
.edithead{display:flex;gap:8px;align-items:center;padding:0 16px 12px}

/* late card */
.late{border-color:color-mix(in srgb,var(--red) 30%,var(--line))}

/* week */
.wd{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;box-shadow:var(--shadow)}
.wd .bar{height:6px;border-radius:9px;background:var(--soft);margin-top:8px;overflow:hidden}
.wd .bar i{display:block;height:100%;border-radius:9px}
.pct{font-family:'Nunito',sans-serif;font-weight:700;font-size:20px;min-width:52px;text-align:right}

/* dash */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 12px;box-shadow:var(--shadow)}
.kpi small{font-size:11.5px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:'Nunito',sans-serif;font-size:26px;font-weight:700;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px}
.cal .c{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;background:var(--soft)}
.cal .c.fut{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.cal .c.td{outline:2px solid var(--ink);outline-offset:1px}
.cal .c .st{position:absolute;top:2px;right:3px;font-size:8px}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin-top:12px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px}
.bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bw .bv{width:100%;max-width:34px;border-radius:10px 10px 6px 6px;transition:height .7s cubic-bezier(.3,.8,.3,1);position:relative;min-height:4px}
.bw .bv span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted)}
.bw small{font-size:11px;color:var(--muted);font-weight:700}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hb .tr{flex:1;height:10px;background:var(--soft);border-radius:9px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:9px}
.hb b{font-size:13px;min-width:28px;text-align:right}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.shelf b{display:block;font-family:'Nunito',sans-serif;font-size:20px;margin-top:6px}
.shelf small{font-size:11px;color:var(--muted)}

/* medal */
.medal{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative;color:rgba(80,40,10,.75);box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.12)}
.medal svg.i{width:28px;height:28px;stroke-width:2}
.t-bronze{background:radial-gradient(circle at 35% 30%,#F3C29A,#B8713F)}
.t-prata{background:radial-gradient(circle at 35% 30%,#FAFBFD,#A5AEBD);color:rgba(50,60,80,.7)}
.t-ouro{background:radial-gradient(circle at 35% 30%,#FFF0A8,#DDA126)}
.t-fogo{background:radial-gradient(circle at 35% 30%,#FFB59A,#E5573E);color:rgba(255,255,255,.9)}
.medal.big{width:128px;height:128px;animation:spinIn .8s cubic-bezier(.2,1.4,.4,1)}
.medal.big svg.i{width:54px;height:54px}
.medal.big::before,.medal.big::after{content:"";position:absolute;bottom:-34px;width:26px;height:46px;background:var(--rib,#E5779F);z-index:-1;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.medal.big::before{left:36px;transform:rotate(14deg)}
.medal.big::after{right:36px;transform:rotate(-14deg)}
@keyframes spinIn{0%{transform:scale(.2) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;position:relative}
.nav button.on{color:var(--acc)}
.nav button.on::after{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:3px;background:var(--acc)}
.nav .badge{position:absolute;top:0;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9.5px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,15,25,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.ov.center{align-items:center;padding:16px}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1);position:relative}
.ov.center .sheet{border-radius:28px;text-align:center;padding:34px 22px 22px;overflow:hidden}
.sheet h3{font-family:'Nunito',sans-serif;font-weight:700;font-size:21px;margin:0 0 6px}
.sheet p.m{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.5}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--ink);background:var(--soft)}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.icgrid button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center}
.icgrid button.on{border-color:var(--ink);background:var(--soft)}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.sats{display:flex;gap:8px;flex-wrap:wrap}
.sats button{padding:9px 14px;border-radius:14px;border:1px solid var(--line);font-weight:700;font-size:13px;background:var(--card)}
.sats button.on{background:var(--c);border-color:var(--c);color:#fff}
.colors{display:flex;gap:6px}
.colors button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.colors button.on{border-color:var(--ink)}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pal{border:1.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--card)}
.pal.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.pal .sw{display:flex}.pal .sw i{width:9px;height:22px;display:block}
.pal .sw i:first-child{border-radius:6px 0 0 6px}.pal .sw i:last-child{border-radius:0 6px 6px 0}
.pal small{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.m2{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 12px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow.off .lmain{opacity:.5}
.lmain{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.lmain .ri{width:40px;height:40px;border-radius:13px}
.lt{min-width:0;font-size:14.5px}.lt b{font-size:17px;font-weight:900}
.lt small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.lsw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.lsw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.lsw.on{background:var(--acc)}.lsw.on i{left:21px}
.pushask{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:20px;padding:12px;margin:0 0 14px;box-shadow:var(--shadow)}
.pushask .ri{width:40px;height:40px;border-radius:13px}
.pushask b{display:block;font-size:14px}.pushask small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.sats.dias7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.sats.dias7 button{padding:10px 0;font-size:12.5px}
.chip2{padding:8px 11px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:12.5px}
.chip2.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:700;z-index:60;animation:up .3s;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:24px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0;line-height:1.5}
/* login / entrada */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;padding:40px 4px 60px;max-width:380px;margin:0 auto}
.glogo{width:84px;height:84px;border-radius:28px;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 40%,transparent)}
.glogo svg.i{width:44px;height:44px;stroke-width:1.9}
.gtitle{font-weight:900;font-size:30px;margin:0 0 8px;color:var(--acc);letter-spacing:-.5px}

/* ---------- cálculos ---------- */
const K=(d,r,i)=>`${d}|${r}|${i}`;
const person=id=>S&&S.people.find(p=>p.id===id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function roomCountIn(checks,d,rid){const r=S.rooms[rid];if(!r)return[0,0];return[r.items.filter(it=>checks[K(d,rid,it.id)]).length,r.items.length]}
const roomCount=(d,rid)=>roomCountIn(S.checks,d,rid);
const roomDone=(d,rid)=>{const[a,b]=roomCount(d,rid);return b>0&&a===b};
function dayCountIn(checks,d){let a=0,b=0;S.sched[d].forEach(r=>{const[x,y]=roomCountIn(checks,d,r);a+=x;b+=y});return[a,b]}
const dayCount=d=>dayCountIn(S.checks,d);
const dayDone=d=>{const[a,b]=dayCount(d);return b>0&&a===b};
const dayPct=d=>{const[a,b]=dayCount(d);return b?Math.round(a/b*100):0};
function weekPct(){let a=0,b=0;for(let d=0;d<7;d++){const[x,y]=dayCount(d);a+=x;b+=y}return b?Math.round(a/b*100):0}
function lateList(){const out=[];for(let d=0;d<TODAY;d++)if(started(d))S.sched[d].forEach(rid=>(S.rooms[rid]?S.rooms[rid].items:[]).forEach(it=>{if(!S.checks[K(d,rid,it.id)])out.push({d,rid,it})}));return out}
const pendCarried=()=>S.carried.filter(c=>!c.done);
const lateTotal=()=>lateList().length+pendCarried().length;
function dayChain(){
 const cur=[];for(let d=0;d<=TODAY;d++)if(started(d))cur.push(dayPct(d));
 const h=S.history;let chain=[];
 if(h.length&&h[h.length-1].id===ymd(addDays(WSTART,-7))){
  for(let i=h.length-1;i>=0;i--){chain=(h[i].per||[]).filter(x=>x!=null).concat(chain);if(i>0&&h[i-1].id!==ymd(addDays(parseYmd(h[i].id),-7)))break}
 }
 return chain.concat(cur);
}
function streak(){const a=dayChain();let s=0;for(let i=a.length-1;i>=0;i--){if(a[i]===100)s++;else if(i===a.length-1)continue;else break}return s}
function bestRun(hist){let best=0,run=0,prev=null;hist.forEach(h=>{if(prev&&h.id!==ymd(addDays(parseYmd(prev),7)))run=0;(h.per||[]).filter(x=>x!=null).forEach(p=>{run=p===100?run+1:0;best=Math.max(best,run)});prev=h.id});return best}
function medalCounts(){
 const c={b:0,p:0,o:0,f:0};S.history.forEach(h=>{const m=h.m||{};c.b+=m.b||0;c.p+=m.p||0;c.o+=m.o||0});
 c.o+=S.mensais.filter(m=>m.completo&&m.id!==MONTH_ID).length;
 if(!S.weekClosed)Object.keys(S.medals).forEach(k=>{const t=k[0];if(k==='o|M')return;if(t==='b')c.b++;else if(t==='p')c.p++;else c.o++});
 if(S.medals['o|M'])c.o++;
 c.f=[7,15,30].filter(x=>Math.max(S.best,streak())>=x).length;return c;
}
function byPersonIn(checks,carried){const c={};S.people.forEach(p=>c[p.id]=0);Object.keys(checks).forEach(k=>{if(k.startsWith('M|'))return;const v=checks[k];if(c[v.by]!=null)c[v.by]++});(carried||[]).forEach(v=>{if(v.done&&c[v.done.by]!=null)c[v.done.by]++});return c}
const byPerson=()=>byPersonIn(S.checks,S.carried);
function pctOfDate(dt){
 const t=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
 if(dt>t)return null;
 if(!startedOn(dt))return undefined;
 if(dt>=WSTART)return dayPct(Math.round((dt-WSTART)/864e5));
 const h=S.history.find(x=>x.id===ymd(mondayOf(dt)));
 const v=h&&h.per?h.per[(dt.getDay()+6)%7]:null;return v==null?undefined:v;
}

let pendingMedal=null;
function award(key,tier,title,sub,col){if(!S.medals[key]){S.medals[key]=1;const rank={bronze:1,prata:2,ouro:3};if(!pendingMedal||rank[tier]>rank[pendingMedal.tier])pendingMedal={tier,title,sub,col}}}
function evalMedals(d,rid){
 if(d==='M'){const[a,b]=roomCount('M','mensal');if(b&&a===b)award('o|M','ouro','Faxina do mês!','Faxina pesada de '+MESES[NOW.getMonth()]+' concluída.',MC);else delete S.medals['o|M'];return}
 const col=DAYS[d].c;
 if(roomDone(d,rid))award(`b|${d}|${rid}`,'bronze','Medalha de Bronze',`${S.rooms[rid].name} concluído na ${DAYS[d].n.toLowerCase()}.`,col);else delete S.medals[`b|${d}|${rid}`];
 if(dayDone(d))award(`p|${d}`,'prata','Medalha de Prata',`${DAYS[d].n} 100% concluída! Que capricho.`,col);else delete S.medals[`p|${d}`];
 let all=true;for(let i=0;i<7;i++)if(!dayDone(i))all=false;
 if(all)award('o|W','ouro','Medalha de Ouro','Semana inteira concluída! A casa agradece.',col);else delete S.medals['o|W'];
}

function stopListeners(){UNSUBS.forEach(f=>{try{f()}catch(e){}});UNSUBS=[]}
function setSync(snap){
 const s=snap.metadata.hasPendingWrites?'saving':(!navigator.onLine?'offline':'ok');
 if(s!==SYNC){SYNC=s;const el=document.getElementById('syncDot');if(el){el.className='sync '+SYNC;el.lastChild.textContent=SYNC==='ok'?'sync':SYNC==='saving'?'salvando':'offline'}}
}
async function ensureDoc(ref,data){try{await db.runTransaction(async t=>{const s=await t.get(ref);if(!s.exists)t.set(ref,data)})}catch(e){console.warn('ensureDoc',e)}}

  }
 }catch(e){}
 await ensureDoc(monthRef(),{checks:{},medals:{},late,sat:null,criado:FV.serverTimestamp()});
}
function openCasa(cid){
 stopListeners();tick();CASA_ID=cid;CASA=WEEK=MONTH=null;BOOTED=false;BACKUPS=null;

 UNSUBS.push(casaRef().onSnapshot(o,s=>{

 },e=>{console.error(e);if(e.code==='permission-denied'){toast('Você não tem mais acesso a esta casa.');db.collection('usuarios').doc(USER.uid).set({casaId:null},{merge:true});stopListeners();onbMode='opts';showOnboarding()}}));
 UNSUBS.push(weekRef().onSnapshot(o,s=>{
  if(!s.exists){ensureDoc(weekRef(),{checks:{},medals:{},carried:[],fechada:false,criado:FV.serverTimestamp()});if(!s.metadata.fromCache)return;WEEK={};}else WEEK=s.data();
  setSync(s);afterData();
 },e=>console.error(e)));
 UNSUBS.push(monthRef().onSnapshot(o,s=>{
  if(!s.exists){createMonth();if(!s.metadata.fromCache)return;MONTH={};}else MONTH=s.data();
  setSync(s);afterData();
 },e=>console.error(e)));
}

/* ---------- virada de semana / fechamento ---------- */
function pendOf(data,wid){
 const P=[],ch=data.checks||{};const ws=parseYmd(wid);
 for(let d=0;d<7;d++)if(startedOn(addDays(ws,d)))S.sched[d].forEach(rid=>(S.rooms[rid]?S.rooms[rid].items:[]).forEach(it=>{if(!ch[K(d,rid,it.id)])P.push({d,rid,id:it.id,t:it.t,keep:true})}));
 (data.carried||[]).filter(c=>!c.done).forEach(c=>P.push({d:null,rid:c.rid,id:c.id,t:c.t,keep:true}));
 return P;
}
function summaryOf(data,id){
 const ch=data.checks||{},md=data.medals||{};const m={b:0,p:0,o:0};
 Object.keys(md).forEach(k=>{if(k[0]==='b')m.b++;else if(k[0]==='p')m.p++;else if(k==='o|W')m.o++});
 const ws=parseYmd(id);
 return{id,label:`${ddmm(ws)}–${ddmm(addDays(ws,6))}`,per:DAYS.map((_,i)=>{if(!startedOn(addDays(ws,i)))return null;const[a,b]=dayCountIn(ch,i);return b?Math.round(a/b*100):0}),m,by:byPersonIn(ch,data.carried)};
}
let CLOSING=null;
async function checkRollover(){
 if(!CASA||CLOSING)return;
 const active=CASA.semanaAtiva;
 if(!active){casaRef().update({semanaAtiva:WEEK_ID}).catch(fail);return}
 if(active>=WEEK_ID)return;
 try{
  const ps=await weekRef(active).get();const d=ps.exists?ps.data():{};
  if(d.fechada||!ps.exists){casaRef().update({semanaAtiva:WEEK_ID}).catch(fail);return}
  CLOSING={id:active,data:d,next:WEEK_ID,auto:true,pend:pendOf(d,active)};weekModal();
 }catch(e){console.error(e)}
}
async function finalize(T){
 const keep=T.pend.filter(p=>p.keep).map(p=>({rid:p.rid,id:p.id,t:p.t}));
 const sum=summaryOf(T.data,T.id);
 const hist=(CASA.historico||[]).filter(h=>h.id!==T.id).concat([sum]).sort((a,b)=>a.id<b.id?-1:1).slice(-104);
 const batch=db.batch();
 batch.set(weekRef(T.id),{fechada:true,resumo:sum},{merge:true});
 batch.set(weekRef(T.next),{carried:keep},{merge:true});
 const upd={historico:hist,recorde:Math.max(CASA.recorde||0,bestRun(hist))};
 if(T.auto)upd.semanaAtiva=WEEK_ID;
 batch.update(casaRef(),upd);
 await batch.commit();
 backup('automático · semana '+sum.label).catch(()=>{});
 return keep.length;
}

/* ---------- interface ---------- */
const UI={tab:'hoje',day:TODAY,open:{},edit:false,calOff:0};
function ring(pct,col,label){const C=2*Math.PI*48;return`<div class="ring" style="--c:${col}"><svg viewBox="0 0 112 112"><circle class="bgc" cx="56" cy="56" r="48"/><circle class="fg" cx="56" cy="56" r="48" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="lbl"><div><b>${pct}%</b><small>${label}</small></div></div></div>`}

function renderRoom(d,rid,col){
 const r=S.rooms[rid];if(!r)return'';
 const[a,b]=roomCount(d,rid);const key=d+'|'+rid;

function satsOfMonth(){const y=NOW.getFullYear(),m=NOW.getMonth();const out=[];for(let i=1;i<=31;i++){const dt=new Date(y,m,i);if(dt.getMonth()!==m)break;if(dt.getDay()===6)out.push(i)}return out}

/* horários no fuso do aparelho (o servidor usa exatamente a mesma conta) */
function tzOff(ms,tz){const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return Date.UTC(+p.year,p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(ms/1000)*1000}
function zoned(y,m,d,h,mi,tz){const g=Date.UTC(y,m-1,d,h,mi);const o=tzOff(g,tz);let r=g-o;const o2=tzOff(r,tz);if(o2!==o)r=g-o2;return r}
function localYMD(ms,tz){const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return[+p.year,+p.month,+p.day]}
function ocorrencias(lem,tz,de,ate){
 const out=[];const[y,m,d]=localYMD(de,tz);const[hh,mm]=String(lem.hora||'08:00').split(':').map(Number);
 const dias=lem.tipo==='mensal'?[5]:(lem.dias||[]);const n=Math.ceil((ate-de)/864e5)+1;
 for(let k=-1;k<=n;k++){
  const dt=new Date(Date.UTC(y,m-1,d+k));const wd=(dt.getUTCDay()+6)%7;if(!dias.includes(wd))continue;
  const Y=dt.getUTCFullYear(),M=dt.getUTCMonth()+1,D=dt.getUTCDate();const ms=zoned(Y,M,D,hh,mm,tz);
  if(ms>=de&&ms<=ate)out.push({ms,data:`${Y}-${pad(M)}-${pad(D)}`,wd,Y,M,D,hh});
 }
 return out.sort((a,b)=>a.ms-b.ms);
}
function proximoEnvio(lems,tz,de){let best=null;(lems||[]).filter(l=>l.ativo).forEach(l=>{const o=ocorrencias(l,tz,de,de+9*864e5)[0];if(o&&(best===null||o.ms<best))best=o.ms});return best}

const newDevId=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function pushSync(retry){
 if(!L.push||!L.push.on||!CASA_ID||!USER||!MSG)return;
 const limite=(pr,ms,msg)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
 const reg=await limite(navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready),15000,'o app não terminou de instalar no navegador. Recarregue a página e tente de novo.');
 const token=await limite(MSG.getToken({vapidKey:FIREBASE_VAPID_KEY,serviceWorkerRegistration:reg}),20000,'sem resposta do serviço de notificações. Verifique a internet.');
 if(!token)throw new Error('O navegador não gerou o token de notificação.');
 try{await devRef().set(Object.assign(devFields(),{token,plataforma:navigator.userAgent.slice(0,140)}),{merge:true})}
 catch(e){if(e.code==='permission-denied'&&!retry){L.push.devId=newDevId();saveLocal();return pushSync(true)}throw e}
 L.push.casa=CASA_ID;saveLocal();
}

async function pushEnable(){
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){render();return toast(perm==='denied'?'Notificações bloqueadas. Libere nas configurações do navegador.':'Permissão não concedida.')}
  const prev=L.push||{};
  L.push={devId:prev.devId||newDevId(),lembretes:prev.lembretes&&prev.lembretes.length?prev.lembretes:DEFAULT_LEMBRETES(),on:true,casa:prev.casa};saveLocal();
  toast('Ativando…');await pushSync();render();toast('Lembretes ativados neste aparelho 🔔');
 }catch(e){console.error(e);if(L.push)L.push.on=false;saveLocal();render();toast('Não foi possível ativar: '+(e.code||e.message))}
}

async function pushRefresh(){
 if(!L.push||!L.push.on)return;
 if(!('Notification' in window)||Notification.permission!=='granted'){L.push.on=false;saveLocal();return}
 const wait=()=>new Promise(r=>{const t=setInterval(()=>{if(MSG_OK!==null){clearInterval(t);r()}},150);setTimeout(()=>{clearInterval(t);r()},6000)});

const DS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function diasTxt(l){
 if(l.tipo==='mensal')return'No sábado da faxina do mês';
 const d=(l.dias||[]).slice().sort();const k=d.join();
 if(k==='0,1,2,3,4,5,6')return'Todos os dias';if(k==='0,1,2,3,4')return'Segunda a sexta';if(k==='0,1,2,3,4,5')return'Segunda a sábado';if(k==='5,6')return'Fim de semana';
 return d.map(i=>DS[i]).join(', ')||'Nenhum dia';
}
function lembretesCard(){
 const st=pushState();
 let h=`<div class="card" id="cardLembretes"><h3>Lembretes no celular <small>${st==='on'?'ativos neste aparelho':''}</small></h3>`;
 const p=t=>`<p class="m2">${t}</p>`;
 if(st==='loading')h+=p('Verificando o suporte a notificações…');
 else if(st==='novapid')h+=p('Para ativar as notificações, falta colar a <b>chave VAPID</b> do Firebase no início do script do index.html. O passo a passo está no README.');
 else if(st==='ios')h+=p('No iPhone, as notificações só funcionam com o app <b>instalado na tela de início</b> (iOS 16.4 ou mais novo). Instale e abra o app pelo ícone.')+`<a class="btn full" href="instalar.html" style="text-decoration:none">📲 Como instalar</a>`;
 else if(st==='nosupport')h+=p('Este navegador não suporta notificações. No Android, use o Chrome; no iPhone, instale o app pelo Safari.');
 else if(st==='denied')h+=p('As notificações estão <b>bloqueadas</b> para o app. No Android: segure o ícone do app → <b>Informações do app → Notificações → Permitir</b>. No navegador: toque no cadeado ao lado do endereço → Permissões → Notificações.');
 else if(st==='off')h+=p('Receba avisos no celular <b>mesmo com o app fechado</b>: as tarefas do dia de manhã, o que ficou faltando à noite e o sábado da faxina pesada. Você escolhe os dias e os horários.')+`<button class="btn dark full" data-act="pushOn">${ic('bell')} Ativar lembretes</button>`;
 else{
  const ls=L.push.lembretes||[];
  h+=ls.map(l=>`<div class="lrow ${l.ativo?'':'off'}"><button class="lmain" data-act="lemEdit" data-id="${l.id}"><span class="ri" style="--rc:var(--acc)">${ic((TIPOS[l.tipo]||TIPOS.livre).i)}</span><span class="lt"><b>${esc(l.hora)}</b> · ${esc(l.tipo==='livre'&&l.msg?l.msg:(TIPOS[l.tipo]||TIPOS.livre).n)}<small>${diasTxt(l)}</small></span></button><button class="lsw ${l.ativo?'on':''}" data-act="lemToggle" data-id="${l.id}" aria-label="Ligar ou desligar"><i></i></button></div>`).join('')||'<div class="empty">Nenhum lembrete. Crie um abaixo.</div>';
  h+=`<button class="btn full" style="margin-top:10px" data-act="lemNew">${ic('plus')} Novo lembrete</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn" data-act="pushTest">${ic('bell','style="width:15px;height:15px"')} Testar</button><button class="btn red" data-act="pushOff">Desativar</button></div>
  <p class="note" style="text-align:left">Cada aparelho tem os próprios lembretes. Eles chegam em até uns 15 minutos do horário escolhido e só avisam quando faz sentido (ex.: "Se faltar algo" não toca se o dia já estiver completo).</p>`;
 }
 return h+'</div>';
}
function pushBanner(){
 if(L.pushAsk||pushState()!=='off')return'';
 return`<div class="pushask"><span class="ri" style="--rc:var(--acc)">${ic('bell')}</span><div style="flex:1;min-width:0"><b>Quer lembretes no celular?</b><small>Avisos nos horários que você escolher, mesmo com o app fechado.</small></div><button class="btn dark" data-act="pushOn">Ativar</button><button class="ib" data-act="pushAskNo" aria-label="Agora não">${ic('x')}</button></div>`;
}
let TL=null;
function lemModal(){
 const l=TL;const isNew=!(L.push.lembretes||[]).some(x=>x.id===l.id);
 let h=`<h3>${isNew?'Novo lembrete':'Editar lembrete'}</h3><p class="m" style="margin:10px 0 8px">Tipo</p>
 ${Object.entries(TIPOS).map(([k,t])=>`<button class="opt ${l.tipo===k?'on':''}" data-act="lemTipo" data-t="${k}"><span class="ri" style="--rc:var(--acc);width:36px;height:36px;border-radius:12px">${ic(t.i)}</span><span style="flex:1"><b>${t.n}</b><br><small style="color:var(--muted)">${t.d}</small></span>${l.tipo===k?ic('check'):''}</button>`).join('')}
 <p class="m" style="margin:14px 0 8px">Horário</p>
 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="time" class="inp" id="lemHora" value="${esc(l.hora)}" style="flex:0 0 150px;font-size:18px;font-weight:800">
 ${[['Manhã','08:00'],['Tarde','14:00'],['Noite','19:00']].map(([n,v])=>`<button class="chip2 ${l.hora===v?'on':''}" data-act="lemHoraQ" data-v="${v}">${n} · ${v}</button>`).join('')}</div>`;
 if(l.tipo!=='mensal')h+=`<p class="m" style="margin:14px 0 8px">Dias</p><div class="sats dias7">${DAYS.map((x,i)=>`<button style="--c:${x.c}" class="${(l.dias||[]).includes(i)?'on':''}" data-act="lemDia" data-d="${i}">${x.s}</button>`).join('')}</div>
 <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${[['Todos','0123456'],['Seg a Sex','01234'],['Fim de semana','56']].map(([n,v])=>`<button class="chip2" data-act="lemDiasQ" data-v="${v}">${n}</button>`).join('')}</div>`;
 else h+=`<p class="note" style="text-align:left;margin-top:10px">Toca só no sábado escolhido na aba <b>Mensal</b>, e não toca se a faxina do mês já estiver completa.</p>`;
 if(l.tipo==='livre')h+=`<p class="m" style="margin:14px 0 8px">Mensagem</p><input class="inp" id="lemMsg" style="width:100%" maxlength="120" placeholder="Ex.: Hora de lavar a louça 🍽️" value="${esc(l.msg||'')}">`;
 h+=`<button class="btn dark full" style="margin-top:16px" data-act="lemSave">Salvar lembrete</button>`;
 if(!isNew)h+=`<button class="btn full red" style="margin-top:8px" data-act="lemDel">Excluir lembrete</button>`;
 modal(h);
}
function lemRead(){if(!TL)return;const h=document.getElementById('lemHora');if(h&&h.value)TL.hora=h.value;const m=document.getElementById('lemMsg');if(m)TL.msg=m.value.trim()}
Object.assign(A,{
 pushOn:()=>pushEnable(),
 pushOff:async()=>{await pushRemove();L.push.on=false;saveLocal();render();toast('Lembretes desativados neste aparelho')},
 pushAskNo:()=>{L.pushAsk=1;saveLocal();render()},
 pushTest:async()=>{
  try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('🔔 Assim chegam os lembretes',{body:'Teste local. Em até 15 min chega também um teste enviado pelo servidor.',icon:'icons/icon-192.png',badge:'icons/badge-96.png',tag:'bpf-teste-local'})}catch(e){toast('Não foi possível mostrar a notificação: '+e.message)}
  devRef().set({teste:true,proximo:Date.now()},{merge:true}).catch(e=>toast('Erro ao agendar o teste: '+(e.code||e.message)));
 },
 lemToggle:e=>{const l=L.push.lembretes.find(x=>x.id===e.dataset.id);if(!l)return;l.ativo=!l.ativo;pushSave();render()},
 lemEdit:e=>{const l=L.push.lembretes.find(x=>x.id===e.dataset.id);if(!l)return;TL=JSON.parse(JSON.stringify(l));lemModal()},
 lemNew:()=>{TL={id:'l'+Date.now().toString(36),tipo:'livre',hora:'12:00',dias:[0,1,2,3,4,5,6],ativo:true,msg:''};lemModal()},
 lemTipo:e=>{lemRead();TL.tipo=e.dataset.t;if(TL.tipo==='mensal')TL.dias=[5];else if(!TL.dias||!TL.dias.length||(TL.dias.length===1&&TL.dias[0]===5))TL.dias=[0,1,2,3,4,5,6];lemModal()},
 lemHoraQ:e=>{lemRead();TL.hora=e.dataset.v;lemModal()},
 lemDia:e=>{lemRead();const i=+e.dataset.d;TL.dias=TL.dias.includes(i)?TL.dias.filter(x=>x!==i):[...TL.dias,i].sort();lemModal()},
 lemDiasQ:e=>{lemRead();TL.dias=e.dataset.v.split('').map(Number);lemModal()},
 lemSave:()=>{
  lemRead();
  if(!/^\d{2}:\d{2}$/.test(TL.hora||''))return toast('Escolha um horário');
  if(TL.tipo!=='mensal'&&!(TL.dias||[]).length)return toast('Escolha pelo menos um dia');
  if(TL.tipo==='livre'&&!TL.msg)return toast('Escreva a mensagem do lembrete');
  if(TL.tipo!=='livre')delete TL.msg;
  const ls=L.push.lembretes;const i=ls.findIndex(x=>x.id===TL.id);TL.ativo=true;if(i>=0)ls[i]=TL;else ls.push(TL);
  ls.sort((a,b)=>a.hora<b.hora?-1:1);TL=null;pushSave();close();render();toast('Lembrete salvo 🔔');
 },
 lemDel:()=>{L.push.lembretes=L.push.lembretes.filter(x=>x.id!==TL.id);TL=null;pushSave();close();render();toast('Lembrete excluído')}
});

/* ---------- virada de dia com o app aberto ---------- */
function checkClock(){
 if(!CASA_ID||!S)return;
 const oldW=WEEK_ID,oldM=MONTH_ID,oldD=DAYKEY;tick();
 if(oldW!==WEEK_ID||oldM!==MONTH_ID){UI.day=TODAY;UI.open={};openCasa(CASA_ID)}
 else if(oldD!==DAYKEY){if(UI.day===TODAY-1)UI.day=TODAY;render()}
}
setInterval(checkClock,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkClock()});
addEventListener('online',()=>{SYNC='ok';const el=document.getElementById('syncDot');if(el){el.className='sync ok';el.lastChild.textContent='sync'}});
addEventListener('offline',()=>{SYNC='offline';const el=document.getElementById('syncDot');if(el){el.className='sync offline';el.lastChild.textContent='offline'}});

/* ---------- início ---------- */
applyPalette();
if(!CONFIGURED||!window.firebase)showNotConfigured();
else{
 showLoading('Abrindo…');
 initMessaging();
 auth.getRedirectResult().catch(e=>{if(e&&e.code)toast(authMsg(e))});
 auth.onAuthStateChanged(onAuth);
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
